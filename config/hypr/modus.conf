#  exec-once
exec-once = uwsm app -- python ~/.config/Modus/main.py
exec = pgrep -x "hypridle" > /dev/null || uwsm app -- hypridle
exec-once = uwsm app -- swww-daemon
exec-once =  wl-paste --type text --watch cliphist store
exec-once =  wl-paste --type image --watch cliphist store
exec-once = wl-clip-persist --clipboard regular


# LAYER RULES FOR BLURS

layerrule = blur 1 namespace:^modus-notifications$
layerrule = xray 0 namespace:^modus-notifications$
layerrule = blur_popups 1 namespace:^modus-notifications$
layerrule = no_anim 1 namespace:^modus-notifications$
layerrule = animation popin namespace:^lockscreen$

layerrule = blur 1 namespace:^modus-launcher$
layerrule = xray 0 namespace:^modus-launcher$
layerrule = blur_popups 1 namespace:^modus-launcher$
layerrule = animation popin namespace:^modus-launcher$

layerrule = blur 1 namespace:^fabric$
layerrule = xray 0 namespace:^fabric$
layerrule = blur_popups 1 namespace:^fabric$
layerrule = blur 1 namespace:^modus$
layerrule = xray 0 namespace:^modus$
layerrule = blur_popups 1 namespace:^modus$
layerrule = animation slide right namespace:^notification-center$


# KEYBINDS

$fabricSend = fabric-cli exec modus
# Reload Modus
bind = SUPER ALT, B, exec, killall modus; uwsm-app $(python $HOME/.config/Modus/main.py)
# Message
bind = SUPER SHIFT, y, exec, $fabricSend 'app.set_css()' # Reload CSS
# # Application Switcher
bind = ALT, TAB, exec, $fabricSend 'switcher.show_switcher()'
# App Launcher
bind = SUPER, SPACE, exec, $fabricSend "launcher.show_launcher()"
# Clipboard History
bind = SUPER, V, exec, $fabricSend "launcher.show_launcher('clip')"
# Wallpapers
bind = SUPER, W, exec, $fabricSend "launcher.show_launcher('wall')"
# Random Wallpaper
bind = ALT SHIFT, W, exec, $fabricSend "launcher.show_launcher('wall random', external=True)"
# Emoji Picker
bind = SUPER, Period, exec, $fabricSend "launcher.show_launcher('em')"
# Power Menu
bind = SUPER, ESCAPE, exec, $fabricSend "launcher.show_launcher('power')"
# Toggle Caffeine
bind = SUPER SHIFT, M, exec, $fabricSend "launcher.show_launcher('caffeine on', external=True)"
# Lock Screen
bind = SUPER, L, exec, python ~/.config/Modus/lock.py

